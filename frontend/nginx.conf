server {
    listen 80;
    # Server name specify karna achha hota hai, localhost ya domain name
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Gzip Compression (Performance)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_proxied any;
    gzip_min_length 1000;

    # 2. Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # 3. API Proxy
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Timeout settings (agar backend slow ho toh request kill na ho)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 4. SPA Routing (Fixed typo: 'location')
    location / {
        try_files $uri $uri/ /index.html;

        # Static files caching (For performance)
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 5. Error Handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

